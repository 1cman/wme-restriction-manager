name: Validate userscript
on:
  push:
    branches: [main, develop/v4-guided-restrictions]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/Restriction_Manager.user.js
      - run: node --check alpha/Restriction_Manager_Guided_Alpha.user.js
      - run: node tests/validate.cjs
      - run: node tests/guided-alpha.cjs
